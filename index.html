<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Face classifier</title>
  </head>
  <body>
    <div id="app"></div>

    <div id="panel">
      <div class="row title">Face classifier</div>

      <div class="row">
        <strong>Model</strong>
        <label class="file-btn">
          Upload STL
          <input type="file" id="stl-upload" accept=".stl,.STL" />
        </label>
        <button id="reset-model">Reset</button>
      </div>

      <div class="row planes-header">
        <strong>Section planes</strong>
        <button id="add-plane" title="Add a plane">+ Add plane</button>
      </div>
      <div id="planes"></div>

      <div class="row legend">
        <span><span class="dot front"></span>front (outer)</span>
        <span><span class="dot back"></span>back (inner)</span>
        <span><span class="dot clp"></span>clipped</span>
      </div>
      <div class="row">
        <label><input type="checkbox" id="show-id-pass" /> Show ID pass (debug)</label>
      </div>
      <div id="status"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
